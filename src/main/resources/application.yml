spring:
  application:
    name: sar-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fincen_sar}
    username: ${DB_USERNAME:saruser}
    password: ${DB_PASSWORD:sarpassword}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — Hibernate only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    max-connections: 200
    threads:
      max: 200
      min-spare: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    com.fincen.sar: INFO

---
spring:
  config:
    activate:
      on-profile: dev

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fincen.sar: DEBUG
