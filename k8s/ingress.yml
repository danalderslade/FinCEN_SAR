apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sar-ingress
  namespace: fincen-sar
  labels:
    app.kubernetes.io/part-of: fincen-sar
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sar.example.com
      secretName: sar-tls
  rules:
    - host: sar.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sar-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sar-web
                port:
                  number: 80
