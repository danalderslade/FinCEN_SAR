apiVersion: v1
kind: ConfigMap
metadata:
  name: sar-api-config
  namespace: fincen-sar
  labels:
    app.kubernetes.io/name: sar-api
    app.kubernetes.io/part-of: fincen-sar
data:
  SPRING_PROFILES_ACTIVE: "default"
  APP_CORS_ALLOWED_ORIGINS: "https://sar.example.com"
  SERVER_PORT: "8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: fincen-sar
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fincen-sar
data:
  POSTGRES_DB: fincen_sar
