apiVersion: apps/v1
kind: Deployment
metadata:
  name: sar-web
  namespace: fincen-sar
  labels:
    app.kubernetes.io/name: sar-web
    app.kubernetes.io/part-of: fincen-sar
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sar-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sar-web
    spec:
      containers:
        - name: sar-web
          image: ghcr.io/danalderslade/fincen-sar-web:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sar-web
  namespace: fincen-sar
  labels:
    app.kubernetes.io/name: sar-web
    app.kubernetes.io/part-of: fincen-sar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sar-web
  ports:
    - port: 80
      targetPort: http
      name: http
