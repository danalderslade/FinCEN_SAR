# NOTE: In production, use a sealed-secrets controller or external secrets operator.
# These are placeholder values — never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: sar-db-credentials
  namespace: fincen-sar
  labels:
    app.kubernetes.io/part-of: fincen-sar
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://postgres:5432/fincen_sar"
  DB_USERNAME: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: sar-jwt-secret
  namespace: fincen-sar
  labels:
    app.kubernetes.io/part-of: fincen-sar
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_TO_A_SECURE_RANDOM_STRING_AT_LEAST_32_CHARS"
