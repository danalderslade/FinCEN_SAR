apiVersion: apps/v1
kind: Deployment
metadata:
  name: sar-api
  namespace: fincen-sar
  labels:
    app.kubernetes.io/name: sar-api
    app.kubernetes.io/part-of: fincen-sar
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sar-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sar-api
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: sar-api
          image: ghcr.io/danalderslade/fincen-sar-api:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: sar-api-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: sar-db-credentials
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sar-db-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sar-db-credentials
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sar-jwt-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sar-api
  namespace: fincen-sar
  labels:
    app.kubernetes.io/name: sar-api
    app.kubernetes.io/part-of: fincen-sar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sar-api
  ports:
    - port: 8080
      targetPort: http
      name: http
